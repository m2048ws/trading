  Production package structure:
    trading.quantity
    trading.quantity.grid
    trading.quantity.refinement
    trading.quantity.algebra
    trading.reference
    trading.application
    trading.economics.instrument

  Current scope includes exact dimension-safe quantities, anonymous uniform-grid
  arithmetic and projection, checked refinements, runtime quantity identity,
  stable reference-data handles, optional exact algebra, and the transitional
  aggregate instrument/order/scenario/fee/P&L/risk economics surface.

  Reference data owns pure immutable catalog transitions and coherent snapshots;
  application currently owns only the two-method effect-polymorphic LiveCatalog
  port. Concrete runtime interpretation and boundary codecs remain future-owned.
  Quantity-owned logical packing is absent until the boundary-codec change
  restores durable reconstruction against immutable reference-data state.

  The architecture charter is documented in docs/design-principles.md. Its
  proposed target modules are not implemented merely because they are named.
  Current transitional exceptions and proposal owners are recorded in
  docs/architecture-charter-audit.md. Minimum build/runtime JDK: 17.
