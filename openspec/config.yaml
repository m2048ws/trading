schema: spec-driven

context: |
  Project: trading
  Build: Scala 3 multi-module SBT

  Current module:
    SBT ID: quantities
    Directory: quantities
    Artifact: trading-quantities
    Primary package: trading.quantity

  Production package structure:
    trading.quantity
    trading.quantity.grid
    trading.quantity.refinement
    trading.quantity.runtime
    trading.quantity.algebra

  Current scope is exact dimension-safe quantities, uniform-grid arithmetic
  and projection, checked refinements, runtime quantity identity, logical
  grid-quantity reconstruction, and optional exact algebra.

  Instruments, orders, positions, accounts, wallets, and other trading
  domain modules are deferred.

