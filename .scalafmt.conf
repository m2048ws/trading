version = "3.11.5"
runner.dialect = scala3

# Layout
maxColumn = 120
lineEndings = unix

indent {
  main = 2
  significant = 2
  callSite = 2
  defnSite = 2
  ctorSite = 2
  ctrlSite = 2
  caseSite = 2
  extendSite = 2
  withSiteRelativeToExtends = 0
  afterInfixSite = 2
}

binPack {
  callSite = Oneline
  defnSite = Oneline
  bracketCallSite = Oneline
  bracketDefnSite = Oneline
  parentConstructors = Oneline
}

danglingParentheses {
  callSite = true
  defnSite = true
  ctrlSite = true
  tupleSite = true
}

# Align broadly, but never at the expense of the 120-column limit.
align {
  preset = most
  allowOverflow = false
  multiline = false
  openParenDefnSite = false
  stripMargin = true
}
assumeStandardLibraryStripMargin = true

# Keep definition signatures horizontal when they fit; otherwise put each
# parameter on its own line and keep the result type beside the closing paren.
verticalMultiline {
  atDefnSite = true
  newlineAfterOpenParen = true
}

newlines {
  # Preserve intentional vertical bodies (notably Scala 3 if/then/else), while
  # still allowing scalafmt to wrap expressions which exceed maxColumn.
  source = keep
  forceBeforeAssign = never
  forceBeforeMultilineAssign = never
  avoidInResultType = true
  sometimesBeforeColonInMethodReturnType = false
}

# Cleanup and canonicalization
rewrite.rules = [
  AvoidInfix,
  Imports,
  RedundantBraces,
  RedundantParens,
  RemoveSemicolons,
  SortModifiers
]

rewrite.avoidInfix.excludeFilters = []
rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantParens.infixSide = all
rewrite.sortModifiers.preset = styleGuide
rewrite.trailingCommas.style = never

rewrite.imports {
  selectors = unfold
  sort = scalastyle
  removeRedundantSelectors = true
  groups = [
    ["java\\..*", "javax\\..*", "scala\\..*"],
    [".*"],
    ["trading\\..*"]
  ]
}

# Normalize all supported legacy syntax to modern Scala 3 syntax and prefer
# significant indentation. Keep compact lambdas parenthesized; use colon
# arguments once their body spans multiple lines.
rewrite.scala3 {
  convertToNewSyntax = true
  newSyntax {
    control = true
    deprecated = true
  }

  optionalBraces {
    enabled = false
    oldSyntaxToo = true
    preferInsert = false
    fewerBraces {
      span {
        min = 2
        max = 1000
      }
      parensToo = true
    }
  }

  endMarker {
    preferInsert = true
    insert.breaks.min = 20
  }
}

# Prose
comments {
  wrap = standalone
  wrapStandaloneSlcAsSlc = true
}

docstrings {
  style = Asterisk
  oneline = fold
  wrap = fold
  wrapMaxColumn = 120
}

# Also format Scala code fences in Markdown documentation.
project.includePaths."+" = ["glob:**.md"]
