name: Scala Steward

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scala-steward
  cancel-in-progress: false

jobs:
  scala-steward:
    name: Check for dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
