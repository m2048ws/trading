name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up SBT
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Check in-process reflection policy
        run: |
          tools/check-in-process-reflection.sh
          tools/test-check-in-process-reflection.sh

      - name: Check formatting, build, and test
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck clean test benchmarks/Jmh/compile
